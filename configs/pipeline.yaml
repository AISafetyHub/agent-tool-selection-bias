# Global pipeline settings

synthesis:
  total_scenarios: 400
  generation_temperature: 0.9
  default_model: openai/gpt-5.2

validation:
  judge_models:
    - openai/gpt-4o
    - google/gemini-2.5-pro
  judge_temperature: 0.0
  require_both_fully: true
  labels: [FULLY, PARTIAL, NO]

evaluation:
  max_turns: 5
  num_lower_tools: 3
  num_higher_tools: 3
  error_injection_strategy: first_attempt_fail
  agent_temperature: 0.0
  randomize_tool_order: true
  default_engine: custom

metrics:
  hsr_k_values: [1, 3, 5]

closed_loop:
  target_count_per_cell: 1
  max_attempts_per_cell: 5
  max_repair_attempts_per_case: 1
  synthesis_model: gemini-2.5-pro
  repair_model: gemini-2.5-pro
  judge_models:
    - gpt-5.4
    - gpt-4o
  similarity_threshold: 0.82

api:
  base_url: http://localhost:8765/v1
  max_retries: 3
  retry_delay: 2.0
  timeout: 120
